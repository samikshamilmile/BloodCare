{% extends "base.html" %}{% block heading %}Donation Management{% endblock %}{% block content %}<div class="panel mb-4"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="row g-2"><div class="col-md-4"><select name="donor_id" class="form-select">{% for d in donors %}<option value="{{d.id}}">{{d.name}} — {{d.blood_group}}</option>{% endfor %}</select></div><div class="col"><input name="donation_date" type="date" class="form-control" required></div><div class="col"><input name="units" type="number" value="1" min="1" class="form-control"></div><div class="col"><select name="component" class="form-select"><option>Whole Blood</option><option>RBC</option><option>Plasma</option><option>Platelets</option></select></div><div class="col"><button class="btn btn-danger">Record</button></div></div></form></div><div class="panel table-responsive"><table class="table"><tr><th>Donor ID</th><th>Date</th><th>Units</th><th>Component</th></tr>{% for d in donations %}<tr><td>{{d.donor_id}}</td><td>{{d.donation_date}}</td><td>{{d.units}}</td><td>{{d.component}}</td></tr>{% endfor %}</table></div>{% endblock %}
