{% extends "base.html" %}{% block heading %}Administration{% endblock %}{% block content %}<div class="row g-4"><div class="col-lg-5"><div class="panel"><h5>Users & Roles</h5>{% for u in users %}<div class="d-flex justify-content-between border-bottom py-2"><span>{{u.username}}</span><span class="badge bg-dark">{{u.role}}</span></div>{% endfor %}</div></div><div class="col-lg-7"><div class="panel"><h5>Audit Log</h5>{% for l in logs %}<div class="small border-bottom py-2"><b>{{l.username}}</b> — {{l.action}}<br><span class="text-muted">{{l.created_at}}</span></div>{% endfor %}</div></div></div>{% endblock %}
