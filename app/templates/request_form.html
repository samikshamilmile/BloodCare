{% extends "base.html" %}{% block heading %}Create Blood Request{% endblock %}{% block content %}<div class="panel narrow"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input class="form-control mb-3" name="patient" placeholder="Patient reference" required><input class="form-control mb-3" name="hospital" placeholder="Hospital" required><input class="form-control mb-3" name="contact" placeholder="Contact"><div class="row g-3"><div class="col"><select name="blood_group" class="form-select">{% for b in ['O-','O+','A-','A+','B-','B+','AB-','AB+'] %}<option>{{b}}</option>{% endfor %}</select></div><div class="col"><input name="units" type="number" min="1" class="form-control" value="1"></div></div><select name="priority" class="form-select mt-3"><option>Normal</option><option>High</option><option>Critical</option></select><button class="btn btn-danger mt-3">Create Request</button></form></div>{% endblock %}
