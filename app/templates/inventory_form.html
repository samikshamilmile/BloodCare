{% extends "base.html" %}{% block heading %}Add Inventory{% endblock %}{% block content %}<div class="panel narrow"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="blood_group" class="form-select mb-3">{% for b in ['O-','O+','A-','A+','B-','B+','AB-','AB+'] %}<option>{{b}}</option>{% endfor %}</select><select name="component" class="form-select mb-3"><option>Whole Blood</option><option>RBC</option><option>Plasma</option><option>Platelets</option></select><input name="units" type="number" min="0" class="form-control mb-3" placeholder="Units" required><input name="batch_code" class="form-control mb-3" placeholder="Batch code"><input name="expiry_date" type="date" class="form-control mb-3" required><button class="btn btn-danger">Save Stock</button></form></div>{% endblock %}
